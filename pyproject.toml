[project]
name = "vehicle-insurance-prediction-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ComradPrimat", email = "eiturygin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "jupyterlab>=4.6.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
vehicle-insurance-prediction-service = "vehicle_insurance_prediction_service:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
